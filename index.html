<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani R | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff77bc;
            --secondary: #00ffff;
            --accent: #b55fe6;
            --bg-color: #0a0812;
            --card-bg: rgba(20, 15, 30, 0.55);
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color) !important;
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: var(--bg-color);
        }

        /* Encabezado */
        header {
            width: 100%;
            max-width: 1100px;
            padding: 2rem 1.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1.title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--accent);
        }

        /* Banner Principal */
        .banner-container {
            width: 100%;
            max-width: 1100px;
            padding: 0 1.5rem;
            margin-bottom: 2rem;
        }

        .main-banner {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 119, 188, 0.3);
            box-shadow: 0 0 25px rgba(255, 119, 188, 0.25);
            transition: all 0.3s ease;
            display: block;
        }

        .main-banner:hover {
            border-color: var(--secondary);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.35);
        }

        /* Tarjeta de Perfil */
        .profile-card {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 119, 188, 0.3);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 20px var(--primary);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #0a0812;
        }

        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
        }

        .profile-bio {
            font-size: 0.85rem;
            color: #d0b0e0;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        /* Estilo del Bloque de Presentación */
        .intro-quote {
            background: rgba(255, 119, 188, 0.05);
            border-left: 3px solid var(--primary);
            border-right: 3px solid var(--secondary);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f3e8ff;
            font-style: italic;
            box-shadow: inset 0 0 10px rgba(181, 95, 230, 0.15);
        }

        /* Botones de Redes Sociales y Enlaces */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem 1.5rem;
            background: rgba(255, 119, 188, 0.08);
            border: 1px solid var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: var(--primary);
            color: #0a0812;
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-2px);
        }

        .link-btn.gallery-btn {
            border-color: var(--secondary);
            background: rgba(0, 255, 255, 0.08);
            color: #ffffff;
        }

        .link-btn.gallery-btn:hover {
            background: var(--secondary);
            color: #0a0812;
            box-shadow: 0 0 20px var(--secondary);
        }

        .link-btn.game-btn {
            border-color: var(--accent);
            background: rgba(181, 95, 230, 0.08);
            color: #ffffff;
        }

        .link-btn.game-btn:hover {
            background: var(--accent);
            color: #0a0812;
            box-shadow: 0 0 20px var(--accent);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            font-size: 0.75rem;
            color: #a080b0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>

    <!-- Banner Principal -->
    <section class="banner-container">

    <!-- Contenido del Perfil -->
    <main class="profile-card">

            "Hola, Yo soy Dani R. Belleza, estilo y una mirada que dice más que mil palabras. ¿Te quedas a descubrir el resto? Te va a encantar."
        </blockquote>

        <div class="links-container">
            <!-- Enlace a la Galería Multimedia -->
            <a href="index1.html" class="link-btn gallery-btn">

            </a>

            <!-- Redes Sociales Oficiales -->

    <footer style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%;">
        <!-- Texto de copyright con espacio abajo -->
        <p style="margin-bottom: 12px; text-align: center;">© Dani R • Official Page</p>
        
        <!-- Contador de visitas ultra pequeño, sutil y centrado -->
        <div style="display: flex; justify-content: center;">
            <a href="https://www.freecounterstat.com" title="website hit counter" target="_blank">
                <img src="https://counter11.optistats.ovh/private/freecounterstat.php?c=81uhpk3tuae43h19qh8m144ldhz39z69" border="0" title="website hit counter" alt="website hit counter" style="width: 55px; height: auto; opacity: 0.6; filter: drop-shadow(0 0 4px rgba(255, 119, 188, 0.3)); display: block;">
            </a>
        </div>

        <!-- Texto de fans centrado con espacio arriba -->
        <p style="margin-top: 12px; font-size: 0.7rem; color: #b55fe6; letter-spacing: 2px; text-align: center; width: 100%;">FANS</p>
    </footer>

    <script>
        /* Animación del Fondo de Partículas Cíclico (Morado -> Blanco -> Morado) */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let w, h, centerX, centerY;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            centerX = w / 2;
            centerY = h / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let infParticles = [];
        const count = 100;

        function getFeminineInfinity(t, scale) {
            const x = scale * Math.cos(t) / (1 + Math.pow(Math.sin(t), 2));
            const y = scale * Math.sin(t) * Math.cos(t) / (1 + Math.pow(Math.sin(t), 2));
            const z = Math.sin(t * 2) * 20;
            return { x, y: y + Math.sin(t * 3) * 8, z };
        }

        for (let i = 0; i < count; i++) {
            infParticles.push({
                t: (i / count) * Math.PI * 2,
                speed: 0.0018 + Math.random() * 0.0012,
                orbitAng: Math.random() * 6.28,
                orbitRadius: 4 + Math.random() * 12,
                size: Math.random() * 2 + 1,
                colorShift: Math.random()
            });
        }

        let time = 0;
        function animate() {
            // Oscilación suave para la opacidad entre 0.15 (blanco luminoso) y 0.55 (morado profundo)
            const fadeAlpha = 0.35 + 0.20 * Math.sin(time * 0.0008);

            ctx.fillStyle = `rgba(10, 8, 18, ${fadeAlpha})`;
            ctx.fillRect(0, 0, w, h);

            const scale = Math.min(w, h) * (w < 768 ? 0.45 : 0.4);

            ctx.globalCompositeOperation = 'lighter';

            infParticles.forEach(p => {
                p.t += p.speed;
                const pos = getFeminineInfinity(p.t, scale);
                
                const rot = time * 0.0004;
                const rx = pos.x * Math.cos(rot) - pos.z * Math.sin(rot);
                const ry = pos.y;

                const x = centerX + rx + Math.cos(p.orbitAng + time * 0.002) * p.orbitRadius;
                const y = centerY + ry + Math.sin(p.orbitAng + time * 0.002) * p.orbitRadius;

                const r = Math.floor(255 * (0.6 + 0.4 * Math.sin(p.colorShift + time * 0.001)));
                const g = Math.floor(120 + 135 * Math.sin(p.colorShift * 2 + time * 0.0015));
                const b = Math.floor(220 + 35 * Math.cos(time * 0.001));

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.6)`;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, 6.28);
                ctx.fill();
            });

            time += 16;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
