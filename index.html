<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani R - Sitio Oficial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e02b5b;
        }
        #mensaje-estado {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>¡Bienvenido a la página de Dani R!</h1>
    <p>Haz clic en el botón para notificar el nuevo contenido a tus suscriptores.</p>
    
    <!-- Botón para disparar la notificación -->
    <button onclick="enviarNotificacion()">📢 Notificar Nuevo Contenido</button>
    
    <div id="mensaje-estado"></div>

    <script>
        function enviarNotificacion() {
            const estadoDiv = document.getElementById("mensaje-estado");
            estadoDiv.innerHTML = "⏳ Procesando solicitud y enviando correos...";
            estadoDiv.style.color = "#ffcc00";

            // ⚠️ REEMPLAZA ESTA URL CON TU URL DE DESPLIEGUE WEB DE APPS SCRIPT
            const URL_APPS_SCRIPT = "AQUÍ_PEGAS_TU_URL_DE_APLICACION_WEB";

            fetch(URL_APPS_SCRIPT)
                .then(response => response.json())
                .then(data => {
                    // Validamos si el servidor devolvió un bloqueo por tiempo
                    if (data.ESTADO === "bloqueado" || data.status === "bloqueado") {
                        estadoDiv.innerHTML = "⚠️ " + data.mensaje;
                        estadoDiv.style.color = "#ff4444";
                        alert("⚠️ " + data.mensaje);
                    } 
                    // Validamos si el envío fue exitoso
                    else if (data.ESTADO === "success" || data.status === "success") {
                        estadoDiv.innerHTML = "✅ ¡Correos enviados con éxito a " + data.enviados + " suscriptores!";
                        estadoDiv.style.color = "#00C851";
                        alert("✅ ¡Éxito! Se enviaron " + data.enviados + " correos.");
                    } else {
                        estadoDiv.innerHTML = "❓ Respuesta inesperada del servidor.";
                        estadoDiv.style.color = "#ffbb33";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    estadoDiv.innerHTML = "❌ Ocurrió un error al conectar con el servidor.";
                    estadoDiv.style.color = "#ff4444";
                });
        }
    </script>

</body>
</html>
